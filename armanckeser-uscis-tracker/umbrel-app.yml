manifestVersion: 1
id: armanckeser-uscis-tracker
category: files
name: USCIS Tracker
version: 0.3.0
tagline: Know what moved on your green card case, and when your date comes up.
icon: https://armanckeser.github.io/selfhost-apps/umbrel/uscis-tracker/icon.png
description: |-
  One tap from a signed-in my.uscis.gov tab reads every case in your household. The tracker keeps the full history, shows what changed since you last looked (including the updates USCIS never announces), and estimates when the visa bulletin will reach your priority date.

  It sends a push notification when a case changes. The refresh runs from your own phone's USCIS session, so the server never holds your USCIS password; your phone has to reach the server (a home server plus Tailscale works well) over HTTPS.
developer: armanckeser
website: https://github.com/armanckeser/uscis-tracker
submitter: armanckeser
submission: https://github.com/armanckeser/selfhost-apps
repo: https://github.com/armanckeser/uscis-tracker
support: https://github.com/armanckeser/uscis-tracker/issues
port: 5181
gallery:
  - https://armanckeser.github.io/selfhost-apps/umbrel/uscis-tracker/1.png
  - https://armanckeser.github.io/selfhost-apps/umbrel/uscis-tracker/2.png
path: ""
releaseNotes: |-
  - Installs from the app stores of Cosmos, Umbrel, CasaOS/ZimaOS, Runtipi, Unraid and Portainer, through https://github.com/armanckeser/selfhost-apps. Or with one command and no checkout: `docker compose -f oci://ghcr.io/armanckeser/uscis-tracker-stack:latest up -d`.
  - One container serves the tracker and its API on port 8080, for amd64 and arm64. An all-in-one image (`ghcr.io/armanckeser/uscis-tracker:aio`) puts the database in the same container, for Unraid and `docker run`.
  - Nothing to set up by hand: the schema, the Web Push keys and the bookmarklet's import key are created on first start.
  - Optional password sign-in (`AUTH_PASSWORD`) for servers that anyone else on the network can reach.
dependencies: []
defaultUsername: ""
defaultPassword: ""
