version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: selfhost-uscis-tracker_app_1
      APP_PORT: 8080
  app:
    image: ghcr.io/armanckeser/uscis-tracker:0.3.0
    restart: on-failure
    stop_grace_period: 1m
    environment:
      DATABASE_URL: postgresql://postgres:${APP_SELFHOST_USCIS_TRACKER_DB}@selfhost-uscis-tracker_postgres_1:5432/app
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_SELFHOST_USCIS_TRACKER_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d app
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${APP_DATA_DIR}/data/pgdata:/var/lib/postgresql/data
