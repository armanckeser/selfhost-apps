manifestVersion: 1
id: selfhost-wishlist
category: files
name: Wishlist
version: 0.33.0
tagline: A wishlist that makes you wait before you buy.
icon: https://armanckeser.github.io/selfhost-apps/umbrel/wishlist/icon.png
description: |-
  Wishlist gives you an allowance that grows by the second. Paste a product link and the name, photo and price fill in; prices are checked daily and you are told when they drop.

  Each item has to cool off before it is ready to buy, by a rule you set such as 3 days for every $100. Buying before then freezes your balance for 7 days. Friends can gift an item from a list you share.

  Open the app after installing and sign up: the first account is yours.
developer: Armanc Keser
website: https://github.com/armanckeser/wishlist
submitter: Armanc Keser
submission: https://github.com/armanckeser/selfhost-apps
repo: https://github.com/armanckeser/wishlist
support: https://github.com/armanckeser/wishlist/issues
port: 5185
gallery:
  - https://armanckeser.github.io/selfhost-apps/umbrel/wishlist/1.png
path: ""
releaseNotes: |-
  - Wishlist now installs from the app stores of Cosmos, Umbrel, CasaOS/ZimaOS, Runtipi, Unraid and Portainer, through https://github.com/armanckeser/selfhost-apps. Or with one command and no checkout: `docker compose -f oci://ghcr.io/armanckeser/wishlist-stack:latest up -d`.
  - One container serves the web app and its API on port 8080, for amd64 and arm64. An all-in-one image (`ghcr.io/armanckeser/wishlist:aio`) puts the database in the same container, for Unraid and `docker run`.
  - Nothing to set up by hand: migrations, the session key and the Web Push keys are created on first start, and the first person to sign up gets the account. `FIRST_SUPERUSER` is optional.
  - Settings shows every section to the admin account (it hid some before).
dependencies: []
defaultUsername: ""
defaultPassword: ""
